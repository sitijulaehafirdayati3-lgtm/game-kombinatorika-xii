<index.html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Kombinatorika - Kelas XII</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#fdf2f8);min-height:100vh;color:#1f2937}
.container{max-width:760px;margin:auto;padding:20px}
.card{background:white;border-radius:24px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin-top:20px}
h1,h2{text-align:center}
.badges{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0}
.badge{background:#f3f4f6;border-radius:14px;padding:10px 14px;font-weight:bold}
#lives{letter-spacing:3px}
.progress{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:18px 0}
#bar{height:100%;width:0%;background:#6366f1;transition:.3s}
.option{display:block;width:100%;padding:14px;margin:10px 0;border:2px solid #e5e7eb;background:#fff;border-radius:14px;text-align:left;font-size:16px;cursor:pointer}
.option:hover{background:#f8fafc;border-color:#818cf8}
.option.correct{background:#dcfce7;border-color:#22c55e}
.option.wrong{background:#fee2e2;border-color:#ef4444}
button.main{border:0;background:#6366f1;color:white;padding:14px 24px;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer}
button.main:hover{filter:brightness(.95)}
.center{text-align:center}
.hidden{display:none}
#feedback{font-weight:bold;min-height:25px;margin:12px 0}
.small{color:#6b7280;font-size:14px}
input{padding:12px;border:2px solid #e5e7eb;border-radius:12px;width:100%;font-size:16px;margin:8px 0 15px}
</style>
</head>
<body>
<div class="container">
<div class="card" id="start">
<h1>🔐 Login Game</h1>
<p class="center"><b>Petualangan Kombinatorika</b><br>Ulangan Harian Matematika Kelas XII</p>
<div class="center">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADIAQAAAACFI5MzAAAA+ElEQVR4nO2XsY7EIAwF5532/395rgCySZECbnU40lIFTTNPxpYTuTk/d+BL/pGgpw953/a7rZAXtAwhBo9bAbfVPKSl6IH6bb/bcp7jnIfDfrc/EoFsNfgAecFRlvbcxm2/22qeXpSI8SjRfrcVknfL5NI+BdwWSStIwIQEklRxmyaRmNE0AQMYC7gtEiMm9A7ClqmE2yIx2mrTp4F13OaJQcIIE1PHbZZc5htmbG9P7Z/Lfi2iqI/dr2Mv0ShUG3iP7Z/Lft0eXItTwO0DJGT81JVzmyYCmL4l1HKbInqacmPFLuI2Sc77NfbxEB87D+Id2e/2JfALvKtef9+JfxUAAAAASUVORK5CYII=" alt="QR Kode Login" style="width:190px;height:190px;border-radius:12px">
<p class="small">📱 Scan QR untuk mendapatkan kode masuk</p>
</div>
<label><b>Kode Masuk</b></label>
<input id="loginCode" placeholder="Masukkan kode dari QR">
<label><b>Nama Siswa</b></label>
<input id="student" placeholder="Masukkan nama siswa">
<div class="center"><button class="main" onclick="loginGame()">🔓 Login & Mulai</button></div>
<p id="loginMsg" class="center" style="color:#dc2626;font-weight:bold;min-height:22px"></p>
<p class="small center">15 soal • 3 level • 3 nyawa ❤️ • skor otomatis</p>
</div>

<div class="card hidden" id="game">
<div class="badges">
<div class="badge" id="level">LEVEL 1</div>
<div class="badge">🏆 Skor: <span id="score">0</span></div>
<div class="badge">❤️ <span id="lives">❤️❤️❤️</span></div>
</div>
<div class="progress"><div id="bar"></div></div>
<p class="small" id="number"></p>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback"></div>
<div class="center"><button class="main hidden" id="next" onclick="nextQuestion()">Soal Berikutnya ➜</button></div>
</div>

<div class="card hidden" id="result">
<h1>🎉 Permainan Selesai!</h1>
<h2 id="resultName"></h2>
<p class="center">Skor akhir kamu:</p>
<h1 id="finalScore"></h1>
<h2 id="rank"></h2>
<p class="center" id="summary"></p>
<div class="center"><button class="main" onclick="location.reload()">🔄 Main Lagi</button></div>
</div>
</div>

<script>
const questions=[
{q:"Nilai dari 5! adalah ....",o:["20","60","100","120"],a:3,l:1},
{q:"Sebuah kantin menyediakan 4 jenis makanan dan 3 jenis minuman. Jika memilih 1 makanan dan 1 minuman, banyak pilihan adalah ....",o:["7","10","12","15"],a:2,l:1},
{q:"Dari 6 siswa akan dipilih 2 siswa untuk menjadi ketua dan wakil kelas. Banyak cara pemilihannya adalah ....",o:["12","15","30","36"],a:2,l:1},
{q:"Banyak cara menyusun 4 buku berbeda pada sebuah rak adalah ....",o:["8","12","16","24"],a:3,l:1},
{q:"Nilai dari C(6,2) adalah ....",o:["10","12","15","20"],a:2,l:1},
{q:"Dari 8 siswa akan dipilih 3 siswa untuk mengikuti lomba matematika. Banyak cara memilihnya adalah ....",o:["24","56","112","336"],a:1,l:2},
{q:"Lima siswa akan duduk berjajar pada 5 kursi. Banyak susunan tempat duduk yang mungkin adalah ....",o:["25","60","100","120"],a:3,l:2},
{q:"Sebuah kode terdiri dari 2 huruf berbeda diikuti 2 angka berbeda. Jika tersedia 5 huruf dan 4 angka, banyak kode yang dapat dibuat adalah ....",o:["120","180","240","360"],a:2,l:2},
{q:"Dalam kelas terdapat 7 siswa laki-laki dan 5 siswa perempuan. Akan dipilih 2 siswa sebagai perwakilan kelas. Banyak cara memilihnya adalah ....",o:["22","44","66","72"],a:2,l:2},
{q:"Dari 7 orang akan dipilih 3 orang sebagai anggota tim. Urutan pemilihan tidak diperhatikan. Banyak cara memilihnya adalah ....",o:["21","35","42","210"],a:1,l:2},
{q:"Dari 9 siswa akan dipilih 3 siswa untuk mengikuti olimpiade. Jika satu siswa tertentu wajib terpilih, banyak cara memilih anggota lainnya adalah ....",o:["21","28","36","56"],a:2,l:3},
{q:"Dari 6 siswa laki-laki dan 4 siswa perempuan akan dipilih 4 orang. Jika harus terdiri dari 2 laki-laki dan 2 perempuan, banyak cara memilihnya adalah ....",o:["60","90","120","180"],a:2,l:3},
{q:"Banyak susunan berbeda dari huruf-huruf pada kata “BUKU” adalah ....",o:["6","8","12","24"],a:2,l:3},
{q:"Enam siswa akan duduk berjajar. Jika Andi dan Budi harus selalu duduk berdampingan, banyak susunan yang mungkin adalah ....",o:["120","180","240","360"],a:2,l:3},
{q:"Sebuah kelas memiliki 8 siswa laki-laki dan 6 siswa perempuan. Akan dipilih 4 siswa sebagai panitia. Jika harus terdiri dari 2 laki-laki dan 2 perempuan, banyak cara memilihnya adalah ....",o:["420","840","1.120","1.680"],a:0,l:3}
];

let i=0,score=0,lives=3,answered=false,name="";
function loginGame(){
 const code=document.getElementById("loginCode").value.trim().toUpperCase();
 const student=document.getElementById("student").value.trim();
 const msg=document.getElementById("loginMsg");
 if(code!=="KOMBI12"){msg.textContent="❌ Kode masuk salah. Silakan scan QR lagi.";return;}
 if(!student){msg.textContent="❌ Nama siswa harus diisi.";return;}
 startGame();
}
function startGame(){
 name=document.getElementById("student").value.trim()||"Pemain";
 document.getElementById("start").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 answered=false;
 const x=questions[i];
 document.getElementById("level").textContent="LEVEL "+x.l+(x.l===1?" – PEMANASAN":x.l===2?" – TANTANGAN":" – MASTER");
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 document.getElementById("number").textContent=`Soal ${i+1} dari ${questions.length}`;
 document.getElementById("bar").style.width=((i)/questions.length*100)+"%";
 document.getElementById("question").textContent=x.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 const box=document.getElementById("options"); box.innerHTML="";
 x.o.forEach((v,k)=>{
   const b=document.createElement("button");
   b.className="option"; b.textContent=String.fromCharCode(65+k)+". "+v;
   b.onclick=()=>answer(k,b); box.appendChild(b);
 });
}
function answer(k,btn){
 if(answered)return;
 answered=true;
 const x=questions[i], buttons=document.querySelectorAll(".option");
 buttons.forEach(b=>b.disabled=true);
 if(k===x.a){
   score+=10; btn.classList.add("correct");
   document.getElementById("feedback").textContent="✅ Benar! +10 poin";
 }else{
   lives--; btn.classList.add("wrong"); buttons[x.a].classList.add("correct");
   document.getElementById("feedback").textContent="❌ Kurang tepat. Jawaban benar: "+String.fromCharCode(65+x.a)+". "+x.o[x.a];
 }
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 document.getElementById("next").textContent=(i===questions.length-1||lives===0)?"Lihat Hasil 🏆":"Soal Berikutnya ➜";
 document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){
 if(lives===0||i===questions.length-1){finish();return;}
 i++;showQuestion();
}
function finish(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("resultName").textContent="👏 "+name;
 document.getElementById("finalScore").textContent=score+" / 150";
 let r=score>=130?"👑 MASTER KOMBINATORIKA":score>=110?"🥇 AHLI KOMBINATORIKA":score>=90?"🥈 JAGO KOMBINATORIKA":score>=70?"🥉 PEJUANG KOMBINATORIKA":"💪 TERUS BERLATIH!";
 document.getElementById("rank").textContent=r;
 document.getElementById("summary").textContent=`Kamu menjawab sampai soal ${i+1}. ${lives===0?"Nyawa habis, tetapi tetap semangat!":"Kerja bagus! Terus tingkatkan kemampuanmu."}`;
}
</script>
</body>
</html>
